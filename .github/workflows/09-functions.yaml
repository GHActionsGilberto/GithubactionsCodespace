name: 09 - Using Functions
on:
    pull_request:
    workflow_dispatch:
jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        run: echo "The PR title is ${{ github.event.pull_request.title }}"
      - name: Print Pr labels
        run: echo |
          cat <<EOF
          ${{ tojson(github.event.pull_request.labels) }}
          EOF
      - name: Bug step
        if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix') }}
        run: echo "I´m a bug fix"
      - name: Sleeps for 20 seconds
        run: sleep 20
      - name: Failing step
        run: exit 1
      - name: This step will be skipped
        if: ${{ success() }}
        run: echo "Print if previous step was successful"
      - name: I will execute
        if: ${{ failure() }}
        run: echo "Print if previous step failed"
      - name: I will execute when not cancelled
        if: ${{ !cancelled() }}
        run: echo "Print if previous step was not cancelled"
      - name: I will execute when cancelled
        if: ${{ cancelled() }}
        run: echo "Print if previous step was  cancelled"