name: 03 - Workflow Runners
on:
  push:
  workflow_dispatch:
jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on Ubuntu"
          echo "is running"
          echo "on Ubuntu"
          echo os: $(uname -a)
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on Windows"
          echo "is running"
          echo "on Windows"
          echo os: $(uname -a)
  macos-echo:
      runs-on: macos-latest
      steps:
        - name: Show OS
          run: |
            echo "This job is running on macOS"
            echo "is running"
            echo "on macOS"
            echo os: $(uname -a)