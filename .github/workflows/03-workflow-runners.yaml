name: 03 - Workflow Runners
on:
  push:
  workflow_dispatch:
jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is"
          echo "is running"
          echo "on Ubuntu"
          echo os: $RUNNER_OS
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        shell: bash
        run: |
          echo "This job "
          echo "is running"
          echo "on Windows"
          echo os: $RUNNER_OS
  macos-echo:
      runs-on: macos-latest
      steps:
        - name: Show OS
          run: |
            echo "This job "
            echo "is running"
            echo "on macOS"
            echo os: $RUNNER_OS