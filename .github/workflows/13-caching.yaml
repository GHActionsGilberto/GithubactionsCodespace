name: 13 - using caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        type: boolean
        description: Whether to use caching or not
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/typescript


    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Testing
        run: npm test
      - name: Building
        run: npm run build
      - name: Deploying to non prod
        run: echo "Deploying to non prod environment"