name: 13 - using caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        type: boolean
        description: Whether to use caching or not
        default: true
      node-version:
        type: choice
        options:
          - "18.x"
          - "20.x"
          - "22.x"
        description: The version of node to use
        default: "20.x"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/typescript


    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download cached dependencies
        if: ${{ inputs.use-cache }}
        uses: actions/cache@v3
        id: cache
        with:
            path: 13-caching/typescript/node_modules
            key: deps-node-modules-${{ hashFiles('13-caching/typescript/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Testing
        run: npm test
      - name: Building
        run: npm run build
      - name: Deploying to non prod
        run: echo "Deploying to non prod environment"