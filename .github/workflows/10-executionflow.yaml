name: 10 - Controlling the execution flow
on:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        description: wheter unit tests pass or fail
        default: true
        

jobs:
  lint-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Lint and build
        run: echo "Linting and building code..."
      - name: Build code
        run: echo "Building code..."
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Running unit tests
        run: echo "Running unit tests..."
      - name: Failing tests
        if: ${{ !inputs.pass-unit-tests }}
        run: |
          echo "Some unit tests failed."
          exit 1
  deploy-nonprod:
    runs-on: ubuntu-latest
    needs:
        - lint-build
        - unit-tests
    steps:
      - name: Deploy to non-prod environment
        run: echo "Deploying to non-prod environment..."
  e2e-tests:
    runs-on: ubuntu-latest
    needs: 
        - deploy-nonprod
    steps:
      - name: Run end-to-end tests
        run: echo "Running end-to-end tests..."
  load-tests:
    runs-on: ubuntu-latest
    needs: 
        - deploy-nonprod
    steps:
      - name: Run load tests
        run: echo "Running load tests..."
  deploy-prod:
    runs-on: ubuntu-latest
    needs: 
        - e2e-tests
        - load-tests
    steps:
      - name: Deploy to production environment
        run: echo "Deploying to production environment..."